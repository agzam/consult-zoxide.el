name: Run Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['29.4', '30.1']
    steps:
      - name: Check out
        uses: actions/checkout@main

      - name: Cache nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ matrix.emacs-version }}

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install zoxide
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zoxide
          zoxide --version

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: .elpa
          key: elpa-${{ matrix.emacs-version }}-${{ hashFiles('Makefile') }}

      - name: Install dependencies
        run: make deps

      - name: Run unit tests
        run: make test

      - name: Run Embark integration tests
        run: make test-embark

      - name: Run end-to-end tests
        run: make test-e2e

      - name: Check byte-compilation
        run: make check-compile
